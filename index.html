<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .output {
            background-color: #f9f9f9;
            padding: 10px;
            border-left: 4px solid #3498db;
            margin-top: 10px;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-group label {
            margin-right: 10px;
            width: 120px;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex-grow: 1;
            margin-right: 10px;
        }
        .input-hint {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Exercices JavaScript</h1>
    
    <div class="section">
        <h2>Manipulation de chaînes</h2>
        
        <div class="input-group">
            <label for="inputChaine">Chaîne :</label>
            <input type="text" id="inputChaine" placeholder="Entrez une chaîne de caractères" value="JavaScript">
        </div>
        
        <button onclick="testInverserChaine()">Inverser la chaîne</button>
        <button onclick="testCompterCaracteres()">Compter les caractères</button>
        
        <div class="input-group">
            <label for="inputPhrase">Phrase :</label>
            <input type="text" id="inputPhrase" placeholder="Entrez une phrase" value="bonjour le monde">
        </div>
        
        <button onclick="testMettreEnMajuscule()">Mettre en majuscule</button>
        
        <div id="output-chaines" class="output">
            <pre>Les résultats s'afficheront ici</pre>
        </div>
    </div>
    
    <div class="section">
        <h2>Fonctions de tableau</h2>
        
        <div class="input-group">
            <label for="inputTableau">Tableau :</label>
            <input type="text" id="inputTableau" placeholder="Entrez des nombres séparés par des virgules" value="5, 2, 9, 1, 7, 3">
            <div class="input-hint">Exemple: 5, 2, 9, 1, 7, 3</div>
        </div>
        
        <button onclick="testTrouverMaximum()">Trouver le maximum</button>
        <button onclick="testTrouverMinimum()">Trouver le minimum</button>
        <button onclick="testSommeTableau()">Somme du tableau</button>
        
        <div class="input-group">
            <label for="inputSeuil">Valeur seuil :</label>
            <input type="number" id="inputSeuil" placeholder="Entrez une valeur seuil" value="3">
        </div>
        
        <button onclick="testFiltrerTableau()">Filtrer le tableau</button>
        
        <div id="output-tableaux" class="output">
            <pre>Les résultats s'afficheront ici</pre>
        </div>
    </div>
    
    <div class="section">
        <h2>Fonctions mathématiques</h2>
        
        <div class="input-group">
            <label for="inputFactorielle">Factorielle :</label>
            <input type="number" id="inputFactorielle" placeholder="Entrez un nombre" min="0" max="170" value="5">
        </div>
        
        <button onclick="testFactorielle()">Calculer la factorielle</button>
        
        <div class="input-group">
            <label for="inputPremier">Nombre premier :</label>
            <input type="number" id="inputPremier" placeholder="Entrez un nombre" min="1" value="7">
        </div>
        
        <button onclick="testEstNombrePremier()">Vérifier si premier</button>
        
        <div class="input-group">
            <label for="inputFibonacci">Termes Fibonacci :</label>
            <input type="number" id="inputFibonacci" placeholder="Entrez un nombre" min="1" max="100" value="10">
        </div>
        
        <button onclick="testSuiteFibonacci()">Générer la suite</button>
        
        <div id="output-math" class="output">
            <pre>Les résultats s'afficheront ici</pre>
        </div>
    </div>
<script src="js/script.js"></script>
</body>
</html>
